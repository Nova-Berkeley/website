# ────────────────────────────────────────────────────────────────
#  TEAM ROSTER  —  exec board and project managers only
# ────────────────────────────────────────────────────────────────
#  Exec board and project managers only. General members are not
#  published. People are listed by role, class standing and major, and
#  nothing is inferred: "Junior", not a guessed graduation year.
#
#  Email addresses are not published.
#
#  Each person needs a unique `id` (lowercase, dashes) and these fields:
#
#    name           Full name
#    tier           "leadership" (exec board) or "pm" (project manager)
#    role           Title, e.g. "President"
#    detail         Major · class standing, e.g. "Economics · Junior"
#    order          Sort order within their tier (lower = first)
#    linkedin       (optional) full URL — the "in" icon appears only
#                   once a real URL is here
#    photo          (optional) path under /public, e.g. "/team/sarah.jpg"
#                   Leave out to show the person's initials instead.
#    coffeeChat     true = appears on the Coffee Chats booking grid.
#                   Set it once that person has agreed to chat. The grid
#                   hides itself while nobody is flagged.
#    urm            true = also appears under "URM coffee chats"
#    coffeeDetail   (optional) shorter detail for the coffee page
# ────────────────────────────────────────────────────────────────

