# ────────────────────────────────────────────────────────────────
#  CLIENTS
# ────────────────────────────────────────────────────────────────
#  Only entries with `cleared: true` are shown on the site. Anything
#  else stays in this file as a record and reaches no page: no logo, no
#  name, not even a count.
#
#  `cleared: true` means the board has confirmed we may name that client
#  publicly. Set it back to false and the client leaves the site on the
#  next build.
#
#  Fields:
#    name      Company name as it should read.
#    cleared   true = publishable. false = on file only, not rendered.
#    featured  true = appears in the large top row, and is the set the
#              homepage shows on its own. The rest fall into the denser
#              band that runs underneath it on the work page.
#    logo      (optional) path under /public, e.g. "/clients/nasa.svg".
#              A cleared client with no logo file renders as a name
#              tile instead, so a missing file never breaks the grid.
#
#  How the whole section is switched: `clientDisplay` in src/config.ts
#    'logos'  full-colour logo tiles (name tile where no logo exists)
#    'names'  names only, no logo files needed
#    'off'    the section does not render at all
# ────────────────────────────────────────────────────────────────

