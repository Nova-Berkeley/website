# ────────────────────────────────────────────────────────────────
#  RECRUITMENT TIMELINE  (shown on the Join page and the homepage)
# ────────────────────────────────────────────────────────────────
#  Dates through the application deadline are set. The interview stages
#  after it are not, so they read "TBA" until someone fills them in.
#
#  Fields:
#    date      What the visitor reads, e.g. "Wed Aug 26". Leave empty
#              for "TBA".
#    on        YYYY-MM-DD. This is what drives the "happening now" and
#              "next up" highlights — the site compares it against the
#              real current date in Berkeley, so nobody has to remember
#              to move a flag. Leave empty when the date is not settled.
#    time      Optional, e.g. "8:00–10:00 PM".
#    location  Optional, e.g. "SOCS 136".
#    pending   Optional. Set it to a short phrase and the stage shows a
#              small marker carrying that text, for a detail that is not
#              settled. Clear it once it is.
#
#  ⚠ Keep `date` and `on` describing the same day. `date` is what people
#  read; `on` is what the site reasons about.
# ────────────────────────────────────────────────────────────────

